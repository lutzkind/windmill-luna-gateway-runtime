name: Apply Codex image fallback v2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded source changes
        shell: bash
        run: |
          set -euo pipefail
          cat > app/codex_image.py <<'PYFILE'
          from __future__ import annotations

          import base64
          import json
          import os
          import time
          import uuid
          from pathlib import Path
          from typing import Any

          import httpx

          CHATGPT_CODEX_BASE_URL = "https://chatgpt.com/backend-api/codex"
          CHATGPT_OAUTH_TOKEN_URL = "https://auth.openai.com/oauth/token"
          CHATGPT_OAUTH_CLIENT_ID = "app_EMoamEEZ73f0CkXaXp7hrann"
          IMAGE_MODEL = "gpt-image-2"
          IMAGE_SIZES = frozenset({"auto", "1024x1024", "1024x1536", "1536x1024"})
          IMAGE_QUALITIES = frozenset({"auto", "low", "medium", "high"})
          IMAGE_BACKGROUNDS = frozenset({"auto", "opaque", "transparent"})


          def _jwt_payload(token: str) -> dict[str, Any]:
              parts = token.split(".")
              if len(parts) < 2:
                  return {}
              encoded = parts[1] + "=" * (-len(parts[1]) % 4)
              try:
                  value = json.loads(base64.urlsafe_b64decode(encoded.encode("ascii")).decode("utf-8"))
              except (ValueError, UnicodeDecodeError, json.JSONDecodeError):
                  return {}
              return value if isinstance(value, dict) else {}


          def _access_token_expiring(token: str, *, skew_seconds: int = 300) -> bool:
              exp = _jwt_payload(token).get("exp")
              return isinstance(exp, (int, float)) and float(exp) <= time.time() + skew_seconds


          def _canonical_size(value: Any) -> str:
              size = str(value or "auto").strip().lower()
              if size in IMAGE_SIZES:
                  return size
              try:
                  width_text, height_text = size.split("x", 1)
                  width, height = int(width_text), int(height_text)
              except (ValueError, TypeError):
                  return "auto"
              if width == height:
                  return "1024x1024"
              return "1024x1536" if height > width else "1536x1024"


          def normalize_generation_payload(payload: dict[str, Any]) -> dict[str, Any]:
              prompt = str(payload.get("prompt") or "").strip()
              if not prompt:
                  raise ValueError("image prompt is required")
              result: dict[str, Any] = {
                  "model": IMAGE_MODEL,
                  "prompt": prompt,
                  "size": _canonical_size(payload.get("size")),
              }
              quality = str(payload.get("quality") or "auto").strip().lower()
              result["quality"] = quality if quality in IMAGE_QUALITIES else "auto"
              background = str(payload.get("background") or "auto").strip().lower()
              result["background"] = background if background in IMAGE_BACKGROUNDS else "auto"
              return result


          def _load_auth(auth_path: Path) -> dict[str, Any]:
              try:
                  value = json.loads(auth_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  raise RuntimeError("codex image authentication is unavailable") from exc
              if not isinstance(value, dict):
                  raise RuntimeError("codex image authentication is invalid")
              return value


          def _tokens(auth: dict[str, Any]) -> dict[str, Any]:
              tokens = auth.get("tokens")
              if not isinstance(tokens, dict):
                  raise RuntimeError("codex image authentication has no ChatGPT tokens")
              if not str(tokens.get("access_token") or "").strip():
                  raise RuntimeError("codex image authentication has no access token")
              return tokens


          def authorization_headers(auth: dict[str, Any]) -> dict[str, str]:
              tokens = _tokens(auth)
              headers = {
                  "Authorization": f"Bearer {str(tokens['access_token']).strip()}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "X-Codex-Image-Turn-Id": str(uuid.uuid4()),
              }
              account_id = str(tokens.get("account_id") or "").strip()
              if account_id:
                  headers["ChatGPT-Account-ID"] = account_id
              return headers


          def _persist_auth(auth_path: Path, auth: dict[str, Any]) -> None:
              tmp_path = auth_path.with_name(f".{auth_path.name}.{uuid.uuid4().hex}.tmp")
              tmp_path.write_text(json.dumps(auth, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              os.chmod(tmp_path, 0o600)
              os.replace(tmp_path, auth_path)


          async def _refresh_auth(client: httpx.AsyncClient, auth_path: Path, auth: dict[str, Any]) -> dict[str, Any]:
              tokens = _tokens(auth)
              refresh_token = str(tokens.get("refresh_token") or "").strip()
              if not refresh_token:
                  raise RuntimeError("codex image authentication has no refresh token")
              response = await client.post(
                  CHATGPT_OAUTH_TOKEN_URL,
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
                  json={
                      "client_id": CHATGPT_OAUTH_CLIENT_ID,
                      "grant_type": "refresh_token",
                      "refresh_token": refresh_token,
                  },
              )
              if response.status_code < 200 or response.status_code >= 300:
                  raise RuntimeError(f"codex image token refresh failed with HTTP {response.status_code}")
              data = response.json()
              if not isinstance(data, dict) or not str(data.get("access_token") or "").strip():
                  raise RuntimeError("codex image token refresh returned no access token")
              updated = dict(auth)
              updated_tokens = dict(tokens)
              for key in ("access_token", "refresh_token", "id_token"):
                  if str(data.get(key) or "").strip():
                      updated_tokens[key] = data[key]
              updated["tokens"] = updated_tokens
              updated["last_refresh"] = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              _persist_auth(auth_path, updated)
              return updated


          async def generate_codex_image(
              payload: dict[str, Any],
              auth_path: Path,
              *,
              timeout_seconds: float = 180,
              transport: httpx.AsyncBaseTransport | None = None,
          ) -> httpx.Response:
              normalized = normalize_generation_payload(payload)
              auth = _load_auth(auth_path)
              timeout = httpx.Timeout(timeout_seconds)
              async with httpx.AsyncClient(timeout=timeout, transport=transport, follow_redirects=False) as client:
                  access_token = str(_tokens(auth).get("access_token") or "")
                  if _access_token_expiring(access_token):
                      try:
                          auth = await _refresh_auth(client, auth_path, auth)
                      except RuntimeError:
                          pass
                  for attempt in range(2):
                      response = await client.post(
                          f"{CHATGPT_CODEX_BASE_URL}/images/generations",
                          headers=authorization_headers(auth),
                          json=normalized,
                      )
                      if response.status_code != 401 or attempt:
                          return response
                      try:
                          auth = await _refresh_auth(client, auth_path, auth)
                      except RuntimeError:
                          return response
              raise RuntimeError("codex image request failed unexpectedly")
          PYFILE

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/codex_upstream.py",
              "from fastapi import FastAPI, Header, HTTPException\n",
              "from fastapi import FastAPI, Header, HTTPException, Response\n\nfrom app.codex_image import generate_codex_image\n",
          )
          replace_once(
              "app/codex_upstream.py",
              '        "image_input_forwarding": True,\n        "image_transport": "codex_exec_image_flags",\n',
              '        "image_input_forwarding": True,\n        "image_generation": True,\n        "image_generation_provider": "chatgpt-codex-subscription",\n        "image_transport": "codex_exec_image_flags",\n',
          )
          replace_once(
              "app/codex_upstream.py",
              '@app.get("/v1/models")\nasync def models',
              '''@app.post("/v1/images/generations")\nasync def image_generations(payload: dict[str, Any], authorization: str | None = Header(default=None)) -> Response:\n    _authorize(authorization)\n    _prepare_runtime_home()\n    try:\n        upstream = await generate_codex_image(\n            payload,\n            RUNTIME_CODEX_HOME / "auth.json",\n            timeout_seconds=TIMEOUT_SECONDS,\n        )\n    except ValueError as exc:\n        raise HTTPException(status_code=400, detail=str(exc)) from exc\n    except RuntimeError as exc:\n        raise HTTPException(status_code=503, detail=str(exc)) from exc\n    return Response(\n        content=upstream.content,\n        status_code=upstream.status_code,\n        media_type=upstream.headers.get("content-type", "application/json").split(";", 1)[0],\n    )\n\n\n@app.get("/v1/models")\nasync def models''',
          )

          replace_once("app/main.py", '    "images/generations": frozenset({"POST"}),\n', '')
          replace_once(
              "app/main.py",
              '        self.circuit = CircuitBreaker(settings)\n        self.semaphore = asyncio.Semaphore(settings.max_concurrency)\n',
              '        self.circuit = CircuitBreaker(settings)\n        self.image_circuit = CircuitBreaker(settings)\n        self.semaphore = asyncio.Semaphore(settings.max_concurrency)\n',
          )
          replace_once(
              "app/main.py",
              '    async def proxy_openai_api(\n',
              '''    async def generate_image(\n        self,\n        *,\n        payload: dict[str, Any],\n        request_id: str,\n        api_key: str,\n    ) -> Response:\n        skip, skip_reason = await self.image_circuit.should_skip()\n        fallback_reason: str | None = None\n        async with self.semaphore:\n            if not skip:\n                codex_response: httpx.Response | None = None\n                reason: str | None = None\n                try:\n                    codex_response = await self.client.post(\n                        f"{self.settings.codex_url}/images/generations",\n                        headers={\n                            "Authorization": f"Bearer {self.settings.codex_api_key}",\n                            "Content-Type": "application/json",\n                            "Accept": "application/json",\n                            "X-Request-ID": request_id,\n                        },\n                        json=payload,\n                    )\n                except httpx.TimeoutException:\n                    reason = "timeout"\n                except httpx.HTTPError:\n                    reason = "network"\n\n                if codex_response is not None:\n                    if 200 <= codex_response.status_code < 300:\n                        if validate_image_success(codex_response):\n                            await self.image_circuit.success()\n                            return relay_response(\n                                codex_response,\n                                provider="codex-image",\n                                fallback_used=False,\n                                fallback_reason=None,\n                                request_id=request_id,\n                            )\n                        reason = "invalid_success"\n                    else:\n                        reason = classify_image_failure_response(codex_response)\n                        if reason is None:\n                            return relay_response(\n                                codex_response,\n                                provider="codex-image",\n                                fallback_used=False,\n                                fallback_reason=None,\n                                request_id=request_id,\n                            )\n\n                reason = reason or "network"\n                await self.image_circuit.failure(reason)\n                fallback_reason = f"image_{reason}"\n            else:\n                fallback_reason = f"image_circuit_open:{skip_reason or 'unknown'}"\n\n            if not api_key:\n                return json_error(\n                    status_code=502,\n                    message="Codex image generation was unavailable and no OpenAI API fallback credential was supplied.",\n                    code="image_fallback_key_missing",\n                    request_id=request_id,\n                    fallback_reason=fallback_reason,\n                )\n            try:\n                api_response = await self.client.post(\n                    f"{self.settings.openai_url}/images/generations",\n                    headers={\n                        "Authorization": f"Bearer {api_key}",\n                        "Content-Type": "application/json",\n                        "Accept": "application/json",\n                        "X-Request-ID": request_id,\n                    },\n                    json=payload,\n                )\n            except httpx.TimeoutException:\n                return json_error(\n                    status_code=504,\n                    message="The OpenAI Images API fallback timed out.",\n                    code="image_api_timeout",\n                    request_id=request_id,\n                    fallback_reason=fallback_reason,\n                )\n            except httpx.HTTPError:\n                return json_error(\n                    status_code=502,\n                    message="The OpenAI Images API fallback request failed.",\n                    code="image_api_network",\n                    request_id=request_id,\n                    fallback_reason=fallback_reason,\n                )\n            return relay_response(\n                api_response,\n                provider="openai-api",\n                fallback_used=True,\n                fallback_reason=fallback_reason,\n                request_id=request_id,\n            )\n\n    async def proxy_openai_api(\n''',
          )
          replace_once(
              "app/main.py",
              'def classify_failure(result: ProviderResult) -> str | None:\n',
              '''def validate_image_success(response: httpx.Response) -> bool:\n    try:\n        data = response.json()\n    except ValueError:\n        return False\n    if not isinstance(data, dict):\n        return False\n    rows = data.get("data")\n    return isinstance(rows, list) and bool(rows) and isinstance(rows[0], dict) and bool(rows[0].get("b64_json"))\n\n\ndef classify_image_failure_response(response: httpx.Response) -> str | None:\n    status = response.status_code\n    text = response.text[:8000].lower()\n    if status == 429:\n        quota_terms = ("image_gen", "usage limit", "quota", "plan limit", "insufficient_quota")\n        return "quota" if any(term in text for term in quota_terms) else "rate_limit"\n    if status in {401, 403}:\n        return "auth"\n    if status == 404:\n        return "capability"\n    if status >= 500:\n        return "upstream_5xx"\n    return None\n\n\ndef classify_failure(result: ProviderResult) -> str | None:\n''',
          )
          replace_once(
              "app/main.py",
              '        circuit = await gateway.circuit.snapshot()\n        return {\n',
              '        circuit = await gateway.circuit.snapshot()\n        image_circuit = await gateway.image_circuit.snapshot()\n        return {\n',
          )
          replace_once(
              "app/main.py",
              '            "circuit": circuit,\n        }\n',
              '            "circuit": circuit,\n            "image_circuit": image_circuit,\n            "image_generation": "codex-primary-api-fallback",\n        }\n',
          )
          replace_once(
              "app/main.py",
              '    @app.api_route("/v1/{path:path}", methods=["GET", "POST"])\n',
              '''    @app.post("/v1/images/generations")\n    @app.post("/images/generations", include_in_schema=False)\n    async def image_generations(request: Request) -> Response:\n        require_gateway_auth(request, selected)\n        payload = await read_json_body(request, selected.max_body_bytes)\n        request_id = request.headers.get("x-request-id") or str(uuid.uuid4())\n        return await gateway.generate_image(\n            payload=payload,\n            request_id=request_id,\n            api_key=selected.server_openai_api_key,\n        )\n\n    @app.api_route("/v1/{path:path}", methods=["GET", "POST"])\n''',
          )

          with Path("tests/test_codex_upstream.py").open("a", encoding="utf-8") as handle:
              handle.write('''\n\ndef test_codex_image_payload_normalizes_social_portrait_size():\n    from app.codex_image import normalize_generation_payload\n    normalized = normalize_generation_payload({"model": "gpt-image-2", "prompt": "premium restaurant table lighting", "size": "1200x1500", "quality": "medium", "output_format": "jpeg"})\n    assert normalized == {"model": "gpt-image-2", "prompt": "premium restaurant table lighting", "size": "1024x1536", "quality": "medium", "background": "auto"}\n    assert "output_format" not in normalized\n\n\ndef test_codex_image_auth_uses_chatgpt_account_header():\n    from app.codex_image import authorization_headers\n    headers = authorization_headers({"tokens": {"access_token": "access-token", "refresh_token": "refresh-token", "account_id": "account-123"}})\n    assert headers["Authorization"] == "Bearer access-token"\n    assert headers["ChatGPT-Account-ID"] == "account-123"\n    assert headers["X-Codex-Image-Turn-Id"]\n''')

          with Path("tests/test_gateway.py").open("a", encoding="utf-8") as handle:
              handle.write('''\n\ndef test_codex_image_primary_is_not_api_passthrough():\n    seen = []\n    def handler(request):\n        seen.append(str(request.url))\n        if request.url.host == "codex.test" and request.url.path.endswith("/images/generations"):\n            return httpx.Response(200, json={"data": [{"b64_json": "aW1hZ2U="}], "size": "1024x1536"})\n        raise AssertionError(f"unexpected provider call: {request.url}")\n    with client_for(handler, server_openai_api_key="server-api-secret") as client:\n        response = client.post("/v1/images/generations", headers=headers(), json={"model": "gpt-image-2", "prompt": "restaurant lighting", "size": "1024x1536"})\n    assert response.status_code == 200\n    assert response.headers["x-luna-gateway-provider"] == "codex-image"\n    assert response.headers["x-luna-gateway-fallback"] == "false"\n    assert seen == ["https://codex.test/v1/images/generations"]\n\n\ndef test_image_quota_falls_back_without_opening_text_circuit():\n    seen = []\n    def handler(request):\n        seen.append(str(request.url))\n        if request.url.host == "codex.test" and request.url.path.endswith("/images/generations"):\n            return httpx.Response(429, json={"error": {"message": "image_gen usage limit reached", "limit_id": "image_gen"}})\n        if request.url.host == "api.test" and request.url.path.endswith("/images/generations"):\n            return httpx.Response(200, json={"data": [{"b64_json": "ZmFsbGJhY2s="}], "size": "1024x1536"})\n        if request.url.host == "codex.test" and request.url.path.endswith("/chat/completions"):\n            return httpx.Response(200, json=success("text-still-codex"))\n        raise AssertionError(f"unexpected provider call: {request.url}")\n    with client_for(handler, server_openai_api_key="server-api-secret") as client:\n        image = client.post("/v1/images/generations", headers=headers(), json={"model": "gpt-image-2", "prompt": "restaurant lighting", "size": "1024x1536"})\n        text = client.post("/v1/chat/completions", headers=headers(), json=payload())\n        health = client.get("/health").json()\n    assert image.status_code == 200\n    assert image.headers["x-luna-gateway-provider"] == "openai-api"\n    assert image.headers["x-luna-gateway-fallback"] == "true"\n    assert image.headers["x-luna-gateway-fallback-reason"] == "image_quota"\n    assert text.status_code == 200\n    assert text.headers["x-luna-gateway-provider"] == "codex"\n    assert health["image_circuit"]["open"] is True\n    assert health["circuit"]["open"] is False\n\n\ndef test_codex_image_client_error_does_not_use_paid_fallback():\n    seen = []\n    def handler(request):\n        seen.append(str(request.url))\n        return httpx.Response(400, json={"error": {"message": "bad image request"}})\n    with client_for(handler, server_openai_api_key="server-api-secret") as client:\n        response = client.post("/v1/images/generations", headers=headers(), json={"model": "gpt-image-2", "prompt": "restaurant lighting"})\n    assert response.status_code == 400\n    assert response.headers["x-luna-gateway-provider"] == "codex-image"\n    assert response.headers["x-luna-gateway-fallback"] == "false"\n    assert seen == ["https://codex.test/v1/images/generations"]\n''')
          PY
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run gateway tests
        run: CODEX_BINARY=true PYTHONPATH=. pytest -q
      - name: Validate Compose
        run: docker compose -f docker-compose.yaml config >/dev/null
      - name: Build production image
        run: docker build -t windmill-luna-gateway:image-fallback-test .
      - name: Commit application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lutzkind"
          git config user.email "132444134+lutzkind@users.noreply.github.com"
          git add app/codex_image.py app/codex_upstream.py app/main.py tests/test_codex_upstream.py tests/test_gateway.py
          git diff --cached --check
          git commit -m "Add Codex-primary image generation with API fallback"
          git push origin HEAD:main
