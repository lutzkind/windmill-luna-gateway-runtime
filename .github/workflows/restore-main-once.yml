name: Restore main.py once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact known-good file and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout 1fda629a627f3f087d228f6c8c2f8fd22e946d4c -- app/main.py
          git rm .github/workflows/restore-main-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py
          git commit -m "Restore gateway main.py after connector probe"
          git push origin HEAD:main
