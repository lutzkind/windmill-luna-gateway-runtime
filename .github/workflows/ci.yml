name: CI
on:
  pull_request:
concurrency:
  group: windmill-luna-gateway-runtime-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify upstream CLI contract
        run: openai-api-server-via-codex serve --help
      - name: Run gateway tests
        run: PYTHONPATH=. pytest -q
      - name: Validate Compose
        run: docker compose -f docker-compose.yaml config >/dev/null
      - name: Build image
        run: docker build -t windmill-luna-gateway:test .
