name: CI
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: windmill-luna-gateway-runtime-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify upstream CLI contract
        run: openai-api-server-via-codex serve --help
      - name: Run gateway tests
        run: PYTHONPATH=. pytest -q
      - name: Validate Compose
        run: docker compose -f docker-compose.yaml config >/dev/null
      - name: Build image
        run: docker build -t windmill-luna-gateway:test .
