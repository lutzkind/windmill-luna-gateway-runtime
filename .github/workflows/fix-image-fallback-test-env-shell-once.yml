name: Fix image fallback test env shell once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch test environment and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          target=.github/workflows/apply-codex-image-fallback-once.yml
          test "$(grep -Fxc '        run: PYTHONPATH=. pytest -q' "$target")" = "1"
          sed -i 's#        run: PYTHONPATH=. pytest -q#        run: CODEX_BINARY=true PYTHONPATH=. pytest -q#' "$target"
          rm -f .github/workflows/fix-image-fallback-test-env-once.yml
          rm .github/workflows/fix-image-fallback-test-env-shell-once.yml
          git config user.name "lutzkind"
          git config user.email "132444134+lutzkind@users.noreply.github.com"
          git add .github/workflows/apply-codex-image-fallback-once.yml .github/workflows/fix-image-fallback-test-env-once.yml .github/workflows/fix-image-fallback-test-env-shell-once.yml
          git diff --cached --check
          git commit -m "Fix image fallback workflow test environment"
          git push origin HEAD:main
