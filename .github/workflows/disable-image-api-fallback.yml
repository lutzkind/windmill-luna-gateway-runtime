name: Disable paid image API fallback
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  harden:
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.6.0
        with:
          python-version: "3.12"
      - name: Apply fail-closed image policy
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          app_path = Path("app/main.py")
          app = app_path.read_text()
          app = replace_once(
              app,
              '    "images/edits": frozenset({"POST"}),\n',
              '',
              "remove paid image edits passthrough",
          )
          marker = '                fallback_reason = "image_circuit_open:quota"\n\n'
          marker_pos = app.index(marker) + len(marker)
          start = app.index('            if not api_key:\n', marker_pos)
          end_block = '''            return relay_response(\n                api_response,\n                provider="openai-api",\n                fallback_used=True,\n                fallback_reason=fallback_reason,\n                request_id=request_id,\n            )\n'''
          end = app.index(end_block, start) + len(end_block)
          fail_closed = '''            return Response(\n                content=json.dumps(\n                    {\n                        "error": {\n                            "message": "Codex image quota is exhausted; paid OpenAI image API fallback is disabled.",\n                            "type": "gateway_provider_error",\n                            "code": "image_quota_unavailable",\n                        }\n                    }\n                ),\n                status_code=429,\n                media_type="application/json",\n                headers=gateway_headers(\n                    provider="none",\n                    fallback_used=False,\n                    fallback_reason=None,\n                    request_id=request_id,\n                ),\n            )\n'''
          app = app[:start] + fail_closed + app[end:]
          app = replace_once(
              app,
              '            "image_generation": "codex-primary-api-fallback",\n',
              '            "image_generation": "codex-only-paid-api-disabled",\n',
              "health image policy",
          )
          app_path.write_text(app)

          tests_path = Path("tests/test_gateway.py")
          tests = tests_path.read_text()
          fn_start = tests.index('def test_image_quota_falls_back_without_opening_text_circuit():\n')
          fn_end = tests.index('\ndef test_model_allowlist_rejects_unlisted_models_before_provider_calls():\n', fn_start)
          replacement = '''def test_image_quota_fails_closed_without_opening_text_circuit():\n    seen = []\n    def handler(request):\n        seen.append(str(request.url))\n        if request.url.host == "codex.test" and request.url.path == "/healthz":\n            return httpx.Response(200, json={"ok": True})\n        if request.url.host == "codex.test" and request.url.path.endswith("/images/generations"):\n            return httpx.Response(429, json={"error": {"message": "image_gen usage limit reached", "limit_id": "image_gen"}})\n        if request.url.host == "codex.test" and request.url.path.endswith("/chat/completions"):\n            return httpx.Response(200, json=success("text-still-codex"))\n        if request.url.host == "api.test" and request.url.path.endswith("/images/generations"):\n            raise AssertionError("paid OpenAI image fallback must stay disabled")\n        raise AssertionError(f"unexpected provider call: {request.url}")\n    with client_for(handler, server_openai_api_key="server-api-secret") as client:\n        image = client.post("/v1/images/generations", headers=headers(), json={"model": "gpt-image-2", "prompt": "restaurant lighting", "size": "1024x1536"})\n        text = client.post("/v1/chat/completions", headers=headers(), json=payload())\n        health = client.get("/health").json()\n    assert image.status_code == 429\n    assert image.json()["error"]["code"] == "image_quota_unavailable"\n    assert image.headers["x-luna-gateway-provider"] == "none"\n    assert image.headers["x-luna-gateway-fallback"] == "false"\n    assert "x-luna-gateway-fallback-reason" not in image.headers\n    assert text.status_code == 200\n    assert text.headers["x-luna-gateway-provider"] == "codex"\n    assert health["image_circuit"]["open"] is True\n    assert health["circuit"]["open"] is False\n    assert health["image_generation"] == "codex-only-paid-api-disabled"\n    assert not any(url.startswith("https://api.test/") for url in seen)\n\n\ndef test_paid_image_edits_passthrough_is_disabled():\n    def handler(request):\n        raise AssertionError(f"paid image API must not be called: {request.url}")\n    with client_for(handler, server_openai_api_key="server-api-secret") as client:\n        response = client.post("/v1/images/edits", headers=headers(), content=b"blocked")\n    assert response.status_code == 404\n\n'''
          tests = tests[:fn_start] + replacement + tests[fn_end + 1:]
          tests_path.write_text(tests)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              '- Fallback: official OpenAI API only when Codex explicitly reports quota or usage-limit exhaustion. Capacity, rate-limit, authentication, network, timeout, upstream, and invalid structured-output failures do not fall back.\n',
              '- Text fallback: official OpenAI API only when Codex explicitly reports quota or usage-limit exhaustion. Capacity, rate-limit, authentication, network, timeout, upstream, and invalid structured-output failures do not fall back.\n',
              "clarify text fallback",
          )
          readme = replace_once(
              readme,
              '- The quota circuit prevents repeated Codex attempts during a confirmed quota-exhaustion window; subsequent Luna requests use the API fallback until that circuit expires.\n',
              '- The quota circuit prevents repeated Codex attempts during a confirmed quota-exhaustion window; subsequent Luna text requests use the API fallback until that circuit expires.\n- Image generation is fail-closed: Codex image quota exhaustion never uses the paid OpenAI Images API, and direct OpenAI image-edit passthrough is not exposed.\n',
              "document image no-spend policy",
          )
          readme_path.write_text(readme)

          Path(".github/workflows/disable-image-api-fallback.yml").unlink()
          PY
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run gateway tests
        run: PYTHONPATH=. pytest -q
      - name: Validate Compose
        env:
          LUNA_AUTO_MODEL: ci-fixture-luna
        run: docker compose -f docker-compose.yaml config >/dev/null
      - name: Commit verified hardening
        run: |
          git config user.name "Luxeillum Operations"
          git config user.email "operations@users.noreply.github.com"
          git add app/main.py tests/test_gateway.py README.md .github/workflows/disable-image-api-fallback.yml
          git diff --cached --check
          git commit -m "Disable paid OpenAI image API paths"
          git push origin HEAD:main
