services:
  codex-upstream:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.codex_upstream:app", "--host", "0.0.0.0", "--port", "18080", "--workers", "1"]
    restart: unless-stopped
    environment:
      CODEX_HOME: /root/.codex
      CODEX_BINARY: codex
      CODEX_MAX_CONCURRENCY: "4"
      CODEX_TIMEOUT_SECONDS: "180"
      OPENAI_VIA_CODEX_API_KEY: internal-codex-sidecar-v1
    volumes:
      - /root/.codex/auth.json:/root/.codex/auth.json:ro
    expose: ["18080"]
    networks: [gateway-private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/healthz', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  windmill-luna-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3036:8080"
    depends_on:
      codex-upstream:
        condition: service_healthy
    environment:
      ALLOWED_API_KEY_SHA256S: "9f3728ab7322339b7efc6e95047ed18cd5d261a9f4fe251ba1805fb49524d76d,68471dcada6d4d3b0468b20ad6ea6fc2ea21451d4d7a28b7fdb63be763679817"
      CODEX_UPSTREAM_API_KEY: internal-codex-sidecar-v1
      CODEX_UPSTREAM_URL: http://codex-upstream:18080/v1
      OPENAI_API_BASE_URL: https://api.openai.com/v1
      ALLOWED_MODELS: gpt-5.6-luna,luna-auto
      MODEL_ALIASES_JSON: '{"luna-auto":"gpt-5.6-luna","gpt-5.6-luna":"gpt-5.6-luna"}'
      PROVIDER_TIMEOUT_SECONDS: "180"
      MAX_CONCURRENCY: "4"
      TRANSIENT_FAILURE_THRESHOLD: "3"
      TRANSIENT_FAILURE_WINDOW_SECONDS: "300"
      TRANSIENT_OPEN_SECONDS: "900"
      QUOTA_OPEN_SECONDS: "1800"
      AUTH_OPEN_SECONDS: "300"
      ENABLE_TEST_CONTROLS: "false"
    expose: ["8080"]
    networks: [gateway-private, coolify]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.luna-gateway-gzip.compress=true
      - traefik.http.middlewares.luna-gateway-redirect.redirectscheme.scheme=https
      - traefik.http.routers.luna-gateway-http.entryPoints=http
      - traefik.http.routers.luna-gateway-http.middlewares=luna-gateway-redirect
      - traefik.http.routers.luna-gateway-http.rule=Host(`luna-gateway.luxeillum.com`)
      - traefik.http.routers.luna-gateway-https.entryPoints=https
      - traefik.http.routers.luna-gateway-https.middlewares=luna-gateway-gzip
      - traefik.http.routers.luna-gateway-https.rule=Host(`luna-gateway.luxeillum.com`)
      - traefik.http.routers.luna-gateway-https.tls=true
      - traefik.http.routers.luna-gateway-https.tls.certresolver=letsencrypt
      - traefik.http.services.luna-gateway.loadbalancer.server.port=8080
      - traefik.http.services.luna-gateway.loadbalancer.serverstransport=luna-gateway-transport@file

networks:
  gateway-private:
  coolify:
    external: true
