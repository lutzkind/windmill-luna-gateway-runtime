services:
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.0
    restart: unless-stopped
    expose: ["8880"]
    networks: [windmill]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 60s

networks:
  windmill:
    external: true
    name: m9qaud6gadgni5bxty30bkdl
